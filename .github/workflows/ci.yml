# Runs on every push to main and every pull request:
# compiles the TypeScript, then builds the backend and runs all tests.
# GitHub's Ubuntu runners have Docker, so Testcontainers can start PostgreSQL for the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js (for the TypeScript compiler)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compile the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B verify
