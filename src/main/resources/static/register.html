<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · HandsOn</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/register.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">HandsOn</a>
  </header>

  <main class="container narrow">
    <h1>Create a volunteer account</h1>
    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="register-form" class="form card">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100" required>
        <p class="field-error" data-error-for="fullName"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
        <p class="field-error" data-error-for="email"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               minlength="10" maxlength="72" required aria-describedby="password-hint">
        <p id="password-hint" class="hint">At least 10 characters.</p>
        <p class="field-error" data-error-for="password"></p>
      </div>
      <button id="register-button" class="button button-primary" type="submit">Create account</button>
    </form>

    <p>Already have an account? <a href="login.html">Log in</a></p>
  </main>
</body>
</html>
