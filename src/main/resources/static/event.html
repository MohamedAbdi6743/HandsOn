<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event · HandsOn</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/event.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">HandsOn</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main class="container">
    <p><a href="index.html">← All events</a></p>
    <div class="page-heading">
      <h1 id="event-title">Loading…</h1>
      <a id="edit-event-link" class="button button-secondary" href="#" hidden>Edit event</a>
    </div>
    <p id="event-location" class="muted"></p>
    <p id="event-description" class="description" hidden></p>
    <div id="message" class="message" role="status" aria-live="polite"></div>

    <h2>Shifts</h2>
    <section id="shift-list" class="card-list" aria-label="Shifts"></section>
  </main>
</body>
</html>
